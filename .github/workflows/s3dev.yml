name: Deploy front to s3

on:
  push:
    branches:
      - develop

jobs:
  deploy:
    name: Deploy com
    runs-on: ubuntu-latest
    env:
      NODE_ENV: production
    steps:
      - name: Checkout
        uses: actions/checkout@v2
      - name: Build
        uses: actions/setup-node@v3
        with:
          node-version: 18
      - run: mv .env_dev_com .env.production
      - run: npm ci
      - run: npm run build
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.S3_KEY_ID }}
          aws-secret-access-key: ${{ secrets.S3_KEY }}
          aws-region: us-east-1
      - name: Deploy static site to S3 bucket
        run: |
          aws s3 sync ./public/ s3://oqtima-dev-com --delete --exclude "*" --include "*.html" --include "page-data/*" --include "app-data.json" --cache-control "public, max-age=0, must-revalidate"
          aws s3 sync ./public/ s3://oqtima-dev-com --delete --exclude "*.html" --exclude "page-data/*" --exclude "app-data.json" --cache-control "public, max-age=31536000, immutable"
          aws s3 cp ./public/sw.js s3://oqtima-dev-com/sw.js --cache-control "public, max-age=0, must-revalidate"
  deploy_eu:
    name: Deploy eu
    runs-on: ubuntu-latest
    env:
      NODE_ENV: production
    steps:
      - name: Checkout
        uses: actions/checkout@v2
      - name: Build
        uses: actions/setup-node@v3
        with:
          node-version: 18
      - run: mv .env_dev_eu .env.production
      - run: npm ci
      - run: npm run build

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.S3_KEY_ID }}
          aws-secret-access-key: ${{ secrets.S3_KEY }}
          aws-region: us-east-1
      - name: Deploy static site to S3 bucket
        run: |
          aws s3 sync ./public/ s3://oqtima-dev-eu --delete --exclude "*" --include "*.html" --include "page-data/*" --include "app-data.json" --cache-control "public, max-age=0, must-revalidate"
          aws s3 sync ./public/ s3://oqtima-dev-eu --delete --exclude "*.html" --exclude "page-data/*" --exclude "app-data.json" --cache-control "public, max-age=31536000, immutable"
          aws s3 cp ./public/sw.js s3://oqtima-dev-eu/sw.js --cache-control "public, max-age=0, must-revalidate"
